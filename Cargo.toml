[package]
name = "thalweg-config-validator"
version = "0.1.0"
edition = "2021"
rust-version = "1.94"

[[bin]]
name = "thalweg-validate"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
toml = "0.8"
clap = { version = "4", features = ["derive"] }
anyhow = "1"
thiserror = "1"

# Pinned to match the runtime's resolved datafusion version exactly
# (54.1.0), so this validator plans SQL against the same expression/type
# surface as the runtime engine it's validating configs for.
datafusion = "54.1.0"
sqlparser = "0.62"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }

# The runtime's UDF crate - registers the same pre-registered Rust UDFs
# the runtime engine uses (get_json_object, avro decimal decode, sha2,
# etc.), so this validator plans SQL against an identical function
# surface rather than a hand-rolled stub.
#
# Path assumes a sibling checkout of the runtime repo. Adjust the path
# if your workspace layout differs; this is the only piece of the
# validator that depends on the runtime source being present locally.
ssync-udf = { path = "../stream-sync/rust/crates/ssync-udf" }

[dev-dependencies]
pretty_assertions = "1"
